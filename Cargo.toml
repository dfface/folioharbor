[workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "crates/application",
    "crates/domain",
    "crates/http",
    "crates/postgres",
    "crates/test-support",
]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["serde"] }
toml = "0.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1.2"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
