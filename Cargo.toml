[workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "crates/application",
    "crates/domain",
    "crates/epub",
    "crates/http",
    "crates/postgres",
    "crates/storage-local",
    "crates/test-support",
]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1.10"
cap-std = "4.0"
cap-fs-ext = "4.0"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
html5ever = "0.36"
http = "1.3"
http-body-util = "0.1"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
markup5ever_rcdom = "0.36"
quick-xml = "0.41"
serde_path_to_error = "0.1"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["serde"] }
toml = "0.9"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1.2"
unicode-properties = { version = "0.1", features = ["general-category"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["v7"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
