[workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "crates/application",
    "crates/domain",
    "crates/http",
]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1.2"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
