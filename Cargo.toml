[workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "crates/domain",
]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1.2"
uuid = { version = "1.17", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
