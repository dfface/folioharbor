openapi: 3.1.0
info:
  title: FolioHarbor API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: {$ref: '#/components/requestBodies/Register'}
      responses:
        '202': {$ref: '#/components/responses/RegistrationAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody: {$ref: '#/components/requestBodies/VerifyEmail'}
      responses:
        '204': {description: Email address verified}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses:
        '200': {$ref: '#/components/responses/SessionIssued'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Session revoked and authentication cookies cleared}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody: {$ref: '#/components/requestBodies/ForgotPassword'}
      responses:
        '202': {$ref: '#/components/responses/PasswordResetAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      requestBody: {$ref: '#/components/requestBodies/ResetPassword'}
      responses:
        '200': {$ref: '#/components/responses/SessionIssued'}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/session:
    get:
      operationId: currentSession
      security: [{cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/CurrentSession'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      security: [{cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/SessionList'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/sessions/{session_id}/revoke:
    post:
      operationId: revokeSession
      security: [{cookieAuth: []}]
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}, example: 018f47b5-58b4-7ba6-9a3a-d9f41f17a26d}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Owned session revoked; current-session cookies are cleared}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries:
    get:
      operationId: listLibraries
      security: [{cookieAuth: []}]
      responses:
        '200': {description: Libraries visible to the authenticated member}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}:
    get:
      operationId: getLibrary
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}]
      responses:
        '200': {description: Authorized library detail}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/settings:
    patch:
      operationId: updateLibrarySettings
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Settings updated and audited atomically}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/members:
    get:
      operationId: listLibraryMembers
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}]
      responses:
        '200': {description: Library members visible to the authenticated member}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/members/{user_id}:
    patch:
      operationId: changeLibraryMemberRole
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Role changed and audited atomically}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeLibraryMember
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Member removed and audited atomically}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/invitations:
    post:
      operationId: inviteLibraryMember
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Invitation created and audited atomically}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503':
          description: Invitation delivery is unavailable; no invitation or allowed audit is persisted
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
              example: {type: 'https://library.example/problems/mail-delivery-unavailable', title: Dependency unavailable, status: 503, detail: A required service is temporarily unavailable., instance: /problems/01JREQ00000000000000000000, code: mail_delivery_unavailable, request_id: 01JREQ00000000000000000000}
  /api/v1/libraries/{library_id}/uploads:
    post:
      operationId: createUpload
      description: Reserves library quota atomically before any EPUB content is accepted. Requires holding.edit.
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/CreateUpload'}
      responses:
        '202': {$ref: '#/components/responses/UploadAccepted'}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {description: Declared upload size exceeds 1 GiB, content must not be sent, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '422': {$ref: '#/components/responses/Problem'}
        '507': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/uploads/{upload_id}:
    get:
      operationId: getUploadStatus
      description: Returns only uploads in the requested library; readers without holding.edit cannot inspect upload status.
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/UploadId'}]
      responses:
        '200': {description: Current durable upload state, content: {application/json: {schema: {$ref: '#/components/schemas/UploadStatus'}}}}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/uploads/{upload_id}/content:
    put:
      operationId: receiveUploadContent
      description: Streams EPUB bytes into the existing reservation. Interrupted or oversized attempts become failed and can retry this same upload_id safely.
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/LibraryId'}, {$ref: '#/components/parameters/UploadId'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/epub+zip: {schema: {type: string, format: binary, maxLength: 1073741824}}
          application/octet-stream: {schema: {type: string, format: binary, maxLength: 1073741824}}
      responses:
        '202': {$ref: '#/components/responses/UploadAccepted'}
        '400': {$ref: '#/components/responses/InvalidSessionIdProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: Upload is not in a receipt or retryable state, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '507': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/books:
    get:
      operationId: listLibraryBooks
      description: Lists active Holdings visible in this Library with stable keyset pagination. The cursor is opaque and clients must not parse or construct it.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/LibraryId'}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque keyset cursor returned by the previous page}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: One display-ready row per visible library Holding
          content: {application/json: {schema: {$ref: '#/components/schemas/BookPage'}}}
        '400': {$ref: '#/components/responses/InvalidIdentifierProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/libraries/{library_id}/items/{item_id}:
    get:
      operationId: getLibraryItem
      description: Returns a transport-safe projection only after resolving the Item through a visible active Holding.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/LibraryId'}
        - {$ref: '#/components/parameters/ItemId'}
      responses:
        '200':
          description: Authorized item detail without Blob, Package, storage, parser, or audit internals
          headers:
            ETag: {schema: {type: string}, description: Weak validator covering item and capability inputs}
          content: {application/json: {schema: {$ref: '#/components/schemas/ItemDetail'}}}
        '400': {$ref: '#/components/responses/InvalidIdentifierProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/items/{item_id}/manifest:
    get:
      operationId: getPublicationManifest
      description: Returns a Readium-style online-reading projection after a fresh item.read authorization check. Opaque resource links use same-origin HTTP paths and never expose archive paths.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ItemId'}
        - {name: If-None-Match, in: header, schema: {type: string}, description: Accepts strong or weak matching validators and the wildcard `*`}
      responses:
        '200':
          description: Authorized publication manifest
          headers:
            ETag: {schema: {type: string}, description: Strong package and parser-version validator}
            Cache-Control: {schema: {type: string}, example: 'private, no-cache'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PublicationManifest'}}}
        '304': {description: Package validator matched}
        '400': {$ref: '#/components/responses/InvalidIdentifierProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/items/{item_id}/resources/{resource_id}:
    get:
      operationId: getPublicationResource
      description: Reauthorizes item.read on every request, including transformed-cache hits, then returns one sanitized allowed EPUB resource. Sanitized local references resolve to this same-origin route with opaque IDs.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ItemId'}
        - {name: resource_id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 128}, description: Opaque package-scoped resource identifier}
        - {name: If-None-Match, in: header, schema: {type: string}, description: Accepts strong or weak matching validators and the wildcard `*`}
      responses:
        '200':
          description: Sanitized document, stylesheet, image, or font with restrictive browser-isolation headers
          headers:
            ETag: {schema: {type: string}, description: Strong Item, package, resource, and sanitizer-version validator}
            Content-Security-Policy: {schema: {type: string}, example: "default-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; script-src 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'self'"}
            X-Content-Type-Options: {schema: {type: string}, example: nosniff}
            Referrer-Policy: {schema: {type: string}, example: no-referrer}
            Cache-Control: {schema: {type: string}, example: 'private, no-cache'}
          content:
            application/xhtml+xml: {schema: {type: string}}
            text/html: {schema: {type: string}}
            text/css: {schema: {type: string}}
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            font/woff: {schema: {type: string, format: binary}}
            font/woff2: {schema: {type: string, format: binary}}
        '304': {description: Resource validator matched after fresh authorization}
        '400': {$ref: '#/components/responses/InvalidIdentifierProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/manifestations/{manifestation_id}/progress:
    get:
      operationId: getReadingProgress
      description: Returns the authenticated user's retained progress only while this Manifestation is readable through an active Holding and Item.
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/ManifestationId'}]
      responses:
        '200':
          description: Current global reading position
          headers: {ETag: {schema: {type: string}, example: '"progress-v3"'}, Cache-Control: {schema: {type: string}, example: 'private, no-store'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ReadingProgress'}}}
        '204':
          description: No saved progress exists
          headers: {ETag: {schema: {type: string}, example: '"progress-v0"'}, Cache-Control: {schema: {type: string}, example: 'private, no-store'}}
        '400': {$ref: '#/components/responses/InvalidIdentifierProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateReadingProgress
      description: Atomically records one idempotent device mutation. Matching base versions advance global state; stale bases update only device state and return both positions.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ManifestationId'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"progress-v[0-9]+"$'}, description: Must encode the same version as JSON baseVersion}
      requestBody: {$ref: '#/components/requestBodies/UpdateReadingProgress'}
      responses:
        '200':
          description: Global progress advanced
          headers: {ETag: {schema: {type: string}, example: '"progress-v4"'}, Cache-Control: {schema: {type: string}, example: 'private, no-store'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ReadingProgress'}}}
        '400': {$ref: '#/components/responses/InvalidIdentifierProblem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/ProgressConflict'}
        '429': {$ref: '#/components/responses/ProgressMutationCapacity'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: folioharbor_session}
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      example: opaque-csrf-token
      description: Opaque session-bound CSRF token for unsafe authenticated requests
    LibraryId:
      name: library_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemId:
      name: item_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ManifestationId:
      name: manifestation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RegisterRequest'}
          example: {email: reader@example.com, password: correct horse battery staple}
    VerifyEmail:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
          example: {token: opaque-email-verification-token}
    Login:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LoginRequest'}
          example: {email: reader@example.com, password: correct horse battery staple}
    ForgotPassword:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
          example: {email: reader@example.com}
    ResetPassword:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
          example: {token: opaque-password-reset-token, new_password: a new correct horse battery staple}
    CreateUpload:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateUploadRequest'}
          example: {file_name: book.epub, media_type: application/epub+zip, declared_bytes: 1048576}
    UpdateReadingProgress:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UpdateReadingProgressRequest'}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'https://library.example/problems/invalid-json-body', title: Invalid request body, status: 422, detail: The request body could not be accepted as JSON for this operation., instance: /problems/01JREQ00000000000000000000, code: invalid_json_body, request_id: 01JREQ00000000000000000000}
    ProgressConflict:
      description: RFC 9457 stale-base conflict containing the current global (version 0 with a null locator when absent) and reporting-device positions, or a safe problem without positions when a mutation id is reused for a different command
      headers:
        Cache-Control: {schema: {type: string}, example: 'private, no-store'}
      content:
        application/problem+json:
          schema:
            anyOf:
              - {$ref: '#/components/schemas/ProgressConflictProblem'}
              - {$ref: '#/components/schemas/ProblemDetails'}
    ProgressMutationCapacity:
      description: The per-user 30-day mutation retention capacity is full; retry after the oldest retained mutation expires
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds until the oldest retained mutation expires}
        Cache-Control: {schema: {type: string}, example: 'private, no-store'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'https://library.example/problems/rate-limited', title: Too many requests, status: 429, detail: Too many requests have been made., instance: /problems/01JREQ00000000000000000000, code: rate_limited, request_id: 01JREQ00000000000000000000}
    InvalidSessionIdProblem:
      description: A malformed UUID was supplied for the session_id path parameter; the use case is not invoked
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'https://library.example/problems/invalid-session-id', title: Invalid path parameter, status: 400, detail: The session_id path parameter must be a UUID., instance: /problems/01JREQ00000000000000000000, code: invalid_session_id, request_id: 01JREQ00000000000000000000}
    InvalidIdentifierProblem:
      description: A malformed UUID was supplied for a catalog path parameter; the use case is not invoked
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'https://library.example/problems/invalid-identifier', title: Invalid path parameter, status: 400, detail: The catalog path parameter must be a UUID., instance: /problems/01JREQ00000000000000000000, code: invalid_identifier, request_id: 01JREQ00000000000000000000}
    RegistrationAccepted:
      description: Registration accepted without account enumeration
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AcceptedResponse'}
          example: {status: pending}
    PasswordResetAccepted:
      description: Password reset accepted whether or not the account exists
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AcceptedResponse'}
          example: {status: accepted}
    SessionIssued:
      description: Fresh opaque session and CSRF cookies issued; secrets are absent from JSON
      headers:
        Set-Cookie: {schema: {type: string}, example: 'folioharbor_session=opaque; HttpOnly; Secure; SameSite=Lax; Path=/'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SessionIssuedResponse'}
          example: {user_id: 018f47b5-58b4-7ba6-9a3a-d9f41f17a26d, session_id: 018f47b5-58b4-7ba6-9a3a-d9f41f17a26e}
    CurrentSession:
      description: Current safe session metadata
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
          example: {session_id: 018f47b5-58b4-7ba6-9a3a-d9f41f17a26e, is_current: true, status: active}
    SessionList:
      description: Safe metadata for sessions owned by the authenticated user
      content:
        application/json:
          schema: {type: array, items: {$ref: '#/components/schemas/Session'}}
          example: [{session_id: 018f47b5-58b4-7ba6-9a3a-d9f41f17a26e, is_current: true, status: active}]
    UploadAccepted:
      description: Upload accepted; poll the Location status resource. Retrying content after failed/interrupted receipt reuses the same upload_id.
      headers:
        Location: {required: true, schema: {type: string}, description: Upload status resource}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UploadStatus'}
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, format: password}}
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties: {token: {type: string}}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, format: password}}
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, format: email}}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties: {token: {type: string}, new_password: {type: string, format: password}}
    AcceptedResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [pending, accepted]}}
    SessionIssuedResponse:
      type: object
      required: [user_id, session_id]
      properties: {user_id: {type: string, format: uuid}, session_id: {type: string, format: uuid}}
    Session:
      type: object
      required: [session_id, is_current, status]
      properties:
        session_id: {type: string, format: uuid}
        is_current: {type: boolean}
        status: {type: string, enum: [active, idle_expired, absolute_expired, revoked]}
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, media_type, declared_bytes]
      properties:
        file_name: {type: string, pattern: '(?i)\\.epub$', maxLength: 512}
        media_type: {type: string, enum: [application/epub+zip, application/octet-stream]}
        declared_bytes: {type: integer, minimum: 1, maximum: 1073741824}
    UploadStatus:
      type: object
      additionalProperties: false
      required: [upload_id, library_id, file_name, media_type, declared_bytes, received_bytes, state, status_url]
      properties:
        upload_id: {type: string, format: uuid}
        library_id: {type: string, format: uuid}
        file_name: {type: string}
        media_type: {type: string, enum: [application/epub+zip, application/octet-stream]}
        declared_bytes: {type: integer, minimum: 1, maximum: 1073741824}
        received_bytes: {type: integer, minimum: 0, maximum: 1073741824}
        state: {type: string, enum: [created, receiving, received, queued, validating, importing, ready, duplicate, failed, expired, retry_wait]}
        status_url: {type: string}
        error_code: {type: [string, 'null'], description: Stable safe code; implementation or storage details are never exposed}
    BookSummary:
      type: object
      additionalProperties: false
      required: [item_id, primary_title, authors, languages, media_type, can_read, can_download]
      properties:
        item_id: {type: string, format: uuid}
        primary_title: {type: string}
        authors: {type: array, items: {type: string}}
        languages: {type: array, items: {type: string}}
        media_type: {type: string, enum: [application/epub+zip, application/octet-stream]}
        can_read: {type: boolean, description: Effective online-reading capability}
        can_download: {type: boolean, description: Effective original-file download capability; independent from can_read}
    BookPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BookSummary'}}
        next_cursor: {type: [string, 'null'], description: Opaque cursor; absent or null at the end}
    ItemDetail:
      type: object
      additionalProperties: false
      required: [item_id, manifestation_id, primary_title, authors, languages, identifiers, media_type, can_read, can_download]
      properties:
        item_id: {type: string, format: uuid}
        manifestation_id: {type: string, format: uuid}
        primary_title: {type: string}
        authors: {type: array, items: {type: string}}
        languages: {type: array, items: {type: string}}
        identifiers: {type: array, items: {type: string}}
        media_type: {type: string, enum: [application/epub+zip, application/octet-stream]}
        can_read: {type: boolean, description: Effective online-reading capability}
        can_download: {type: boolean, description: Effective original-file download capability; independent from can_read}
    PublicationManifest:
      type: object
      additionalProperties: false
      required: [metadata, manifestationId, readingOrder, resources, toc, links]
      properties:
        metadata:
          type: object
          additionalProperties: false
          required: [title, authors, languages]
          properties:
            title: {type: string}
            authors: {type: array, items: {type: string}}
            languages: {type: array, items: {type: string}}
        manifestationId: {type: string, format: uuid, description: Exact Manifestation identifier used by reading-state synchronization}
        readingOrder: {type: array, items: {$ref: '#/components/schemas/PublicationLink'}}
        resources: {type: array, items: {$ref: '#/components/schemas/PublicationLink'}}
        toc: {type: array, items: {$ref: '#/components/schemas/PublicationLink'}}
        links: {type: array, items: {$ref: '#/components/schemas/PublicationLink'}}
    PublicationLink:
      type: object
      additionalProperties: false
      required: [href, type]
      properties:
        href: {type: string, description: Same-origin API link containing only an opaque resource identifier}
        type: {type: string}
        rel: {type: string}
        title: {type: string}
    Locator:
      type: object
      additionalProperties: false
      required: [href, locations, extensions]
      properties:
        href: {type: string, minLength: 1, maxLength: 2048}
        type: {type: string, minLength: 1, maxLength: 255}
        locations:
          type: object
          additionalProperties: false
          properties:
            progression: {type: number, minimum: 0, maximum: 1}
            position: {type: integer, minimum: 0}
            totalProgression: {type: number, minimum: 0, maximum: 1}
            fragments: {type: array, maxItems: 16, items: {type: string, maxLength: 2048}}
        text:
          type: object
          additionalProperties: false
          properties: {before: {type: string, maxLength: 4096}, highlight: {type: string, maxLength: 4096}, after: {type: string, maxLength: 4096}}
        extensions:
          type: object
          additionalProperties: false
          required: [version, values]
          properties:
            version: {type: integer, const: 1}
            values: {type: object, maxProperties: 16, additionalProperties: {type: [boolean, integer, number, string]}}
    ReadingProgress:
      type: object
      additionalProperties: false
      required: [manifestationId, locator, version, updatedAt]
      properties:
        manifestationId: {type: string, format: uuid}
        packageId: {type: [string, 'null'], format: uuid}
        contentUnitId: {type: [string, 'null'], format: uuid}
        locator: {$ref: '#/components/schemas/Locator'}
        version: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
    DeviceReadingProgress:
      type: object
      additionalProperties: false
      required: [deviceId, locator, updatedAt]
      properties:
        deviceId: {type: string, format: uuid}
        locator: {$ref: '#/components/schemas/Locator'}
        updatedAt: {type: string, format: date-time}
    ConflictGlobalReadingProgress:
      type: object
      additionalProperties: false
      required: [manifestationId, locator, version, updatedAt]
      properties:
        manifestationId: {type: string, format: uuid}
        packageId: {type: [string, 'null'], format: uuid}
        contentUnitId: {type: [string, 'null'], format: uuid}
        locator:
          oneOf:
            - {$ref: '#/components/schemas/Locator'}
            - {type: 'null'}
        version: {type: integer, minimum: 0}
        updatedAt: {type: [string, 'null'], format: date-time}
    UpdateReadingProgressRequest:
      type: object
      additionalProperties: false
      required: [deviceId, clientMutationId, baseVersion, locator]
      properties:
        deviceId: {type: string, format: uuid}
        clientMutationId: {type: string, format: uuid}
        baseVersion: {type: integer, minimum: 0}
        packageId: {type: [string, 'null'], format: uuid}
        contentUnitId: {type: [string, 'null'], format: uuid}
        locator: {$ref: '#/components/schemas/Locator'}
    ProgressConflictProblem:
      allOf:
        - {$ref: '#/components/schemas/ProblemDetails'}
        - type: object
          required: [global, device]
          properties:
            global: {$ref: '#/components/schemas/ConflictGlobalReadingProgress'}
            device: {$ref: '#/components/schemas/DeviceReadingProgress'}
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, examples: [malformed_json, invalid_json_body, unsupported_media_type, invalid_session_id, unauthenticated, csrf_failed, rate_limited, session_not_found]}
        request_id: {type: string, description: ULID request identifier}
