worker_processes auto;
pid /tmp/folioharbor-nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 0;
    client_body_temp_path /tmp/folioharbor-client-body;
    fastcgi_temp_path /tmp/folioharbor-fastcgi;
    proxy_temp_path /tmp/folioharbor-proxy;
    scgi_temp_path /tmp/folioharbor-scgi;
    uwsgi_temp_path /tmp/folioharbor-uwsgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        root /usr/share/folioharbor/web;
        index index.html;

        location ~ ^/(?:api|health)/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-src blob:; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-src blob:; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
}
